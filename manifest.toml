# Manifest consumed by the upstream Caelestia CLI.
# The CLI's package manager targets Arch-based distributions; it is not a
# cross-distro provisioning system and does not configure GPU drivers/services.

packages = ["caelestia-shell", "caelestia-cli"]
post_install = [
    "test -f ${XDG_STATE_HOME:-$HOME/.local/state}/caelestia/scheme.json || caelestia scheme set -n caelestia",
    "caelestia shell -d >/dev/null 2>&1 || true",
]
post_update = ["caelestia shell -k >/dev/null 2>&1 || true; sleep 1; caelestia shell -d >/dev/null 2>&1 || true"]

[[components]]
name = "hypr"
default = true
packages = ["hyprland", "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk"]
post_install = [
    "hyprctl reload >/dev/null 2>&1 || true",
    "chmod +x $HOME/.local/bin/caelestia-watcher $HOME/.local/bin/caelestia-spicetify-watch $HOME/.local/bin/caelestia-numlock-resume",
    "systemctl --user daemon-reload >/dev/null 2>&1 || true",
    "systemctl --user enable --now caelestia-numlock-resume.service >/dev/null 2>&1 || true",
]
post_update = [
    "hyprctl reload >/dev/null 2>&1 || true",
    "chmod +x $HOME/.local/bin/caelestia-watcher $HOME/.local/bin/caelestia-spicetify-watch $HOME/.local/bin/caelestia-numlock-resume",
    "systemctl --user daemon-reload >/dev/null 2>&1 || true",
    "systemctl --user enable --now caelestia-numlock-resume.service >/dev/null 2>&1 || true",
]
[[components.entries]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"
[[components.entries]]
src = "caelestia/hypr-vars.lua"
dest = "$XDG_CONFIG_HOME/caelestia/hypr-vars.lua"
[[components.entries]]
src = "caelestia/hypr-user.lua"
dest = "$XDG_CONFIG_HOME/caelestia/hypr-user.lua"
[[components.entries]]
src = "scripts/caelestia-watcher.sh"
dest = "$HOME/.local/bin/caelestia-watcher"
[[components.entries]]
src = "scripts/caelestia-spicetify-watch.sh"
dest = "$HOME/.local/bin/caelestia-spicetify-watch"
[[components.entries]]
src = "scripts/caelestia-numlock-resume.sh"
dest = "$HOME/.local/bin/caelestia-numlock-resume"
[[components.entries]]
src = "systemd/caelestia-numlock-resume.service"
dest = "$XDG_CONFIG_HOME/systemd/user/caelestia-numlock-resume.service"

[[components]]
name = "hibernate"
packages = []
post_install = ["chmod +x $HOME/.local/bin/caelestia-enable-hibernate", "sudo $HOME/.local/bin/caelestia-enable-hibernate"]
post_update = ["chmod +x $HOME/.local/bin/caelestia-enable-hibernate", "sudo $HOME/.local/bin/caelestia-enable-hibernate"]
[[components.entries]]
src = "scripts/caelestia-enable-hibernate.sh"
dest = "$HOME/.local/bin/caelestia-enable-hibernate"

[[components]]
name = "fish"
default = true
packages = ["fish", "eza", "zoxide", "direnv"]
post_install = [
    "mkdir -p ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia",
    "touch ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia/user-config.fish",
]
[[components.entries]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "foot"
default = true
packages = ["foot"]
[[components.entries]]
src = "foot"
dest = "$XDG_CONFIG_HOME/foot"

[[components]]
name = "fastfetch"
default = true
packages = ["fastfetch"]
[[components.entries]]
src = "fastfetch"
dest = "$XDG_CONFIG_HOME/fastfetch"

[[components]]
name = "btop"
default = true
packages = ["btop"]
post_install = ["killall -USR2 btop 2>/dev/null || true"]
post_update = ["killall -USR2 btop 2>/dev/null || true"]
[[components.entries]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "thunar"
default = true
packages = ["thunar", "thunar-volman", "gvfs"]
[[components.entries]]
src = "thunar"
dest = "$XDG_CONFIG_HOME/Thunar"

[[components]]
name = "automount"
default = true
packages = ["udisks2", "gvfs", "gvfs-udisks2", "udiskie"]
post_install = [
    "chmod +x $HOME/.local/bin/caelestia-enable-automount",
    "$HOME/.local/bin/caelestia-enable-automount",
    "systemctl --user daemon-reload >/dev/null 2>&1 || true",
    "systemctl --user enable --now caelestia-udiskie.service >/dev/null 2>&1 || true",
]
post_update = [
    "chmod +x $HOME/.local/bin/caelestia-enable-automount",
    "$HOME/.local/bin/caelestia-enable-automount",
    "systemctl --user daemon-reload >/dev/null 2>&1 || true",
    "systemctl --user enable --now caelestia-udiskie.service >/dev/null 2>&1 || true",
]
[[components.entries]]
src = "automount/49-caelestia-automount.rules"
dest = "$HOME/.local/share/caelestia/automount/49-caelestia-automount.rules"
[[components.entries]]
src = "scripts/caelestia-enable-automount.sh"
dest = "$HOME/.local/bin/caelestia-enable-automount"
[[components.entries]]
src = "systemd/caelestia-udiskie.service"
dest = "$XDG_CONFIG_HOME/systemd/user/caelestia-udiskie.service"

[[components]]
name = "starship"
default = true
packages = ["starship"]
[[components.entries]]
src = "starship.toml"
dest = "$XDG_CONFIG_HOME/starship.toml"

[[components]]
name = "gtk"
default = true
packages = ["adw-gtk-theme", "papirus-icon-theme", "papirus-folders"]

[[components]]
name = "qt"
default = true
packages = ["qt5ct-kde", "qt6ct-kde"]

[[components]]
name = "auth"
default = true
packages = ["hyprpolkitagent"]

[[components]]
name = "network"
default = true
packages = ["networkmanager"]

[[components]]
name = "bluetooth"
default = true
packages = ["bluez", "bluez-utils"]

[[components]]
name = "pipewire"
default = true
packages = ["pipewire", "pipewire-pulse", "pipewire-audio", "pipewire-alsa", "pipewire-jack", "wireplumber"]

[[components]]
name = "clipboard"
default = true
packages = ["wl-clipboard", "cliphist", "ydotool"]

[[components]]
name = "fonts"
default = true
packages = ["noto-fonts", "noto-fonts-cjk", "noto-fonts-emoji", "noto-fonts-extra", "ttf-jetbrains-mono-nerd", "ttf-ms-fonts", "graphite-cursor-theme-git"]

[[components]]
name = "tools"
default = true
packages = ["curl", "git", "inotify-tools", "util-linux", "trash-cli", "jq", "bat", "ripgrep", "hyprpicker", "xdg-user-dirs", "app2unit", "gammastep", "udiskie", "cava", "mpv", "pavucontrol", "fuzzel", "less", "nvtop", "openssh", "reflector", "wget", "7zip"]
post_install = ["xdg-user-dirs-update"]

[[components]]
name = "nvim"
default = true
packages = ["neovim", "vim"]
[[components.entries]]
src = "nvim"
dest = "$XDG_CONFIG_HOME/nvim"

[[components]]
name = "development"
default = true
packages = ["python", "python-pip", "nodejs", "npm", "pnpm", "go", "rust", "jdk-openjdk", "maven", "luarocks", "tree-sitter-cli", "lazygit", "lazydocker", "lazysql-bin", "postman"]

[[components]]
name = "tmux"
default = true
packages = ["tmux", "git"]
post_install = ["bash $HOME/.local/bin/caelestia-install-tpm"]
post_update = ["bash $HOME/.local/bin/caelestia-install-tpm"]
[[components.entries]]
src = "tmux"
dest = "$XDG_CONFIG_HOME/tmux"
[[components.entries]]
src = "caelestia/templates/tmux-colors.conf"
dest = "$XDG_CONFIG_HOME/caelestia/templates/tmux-colors.conf"
[[components.entries]]
src = "scripts/caelestia-install-tpm.sh"
dest = "$HOME/.local/bin/caelestia-install-tpm"

[[components]]
name = "uwsm"
packages = ["uwsm"]
[[components.entries]]
src = "uwsm"
dest = "$XDG_CONFIG_HOME/uwsm"

[[components]]
name = "opencode"
default = true
packages = ["opencode"]
[[components.entries]]
src = "opencode"
dest = "$XDG_CONFIG_HOME/opencode"

[[components]]
name = "rclone"
default = true
packages = ["rclone"]

[[components]]
name = "caelestia-cli-config"
default = true
[[components.entries]]
src = "caelestia/cli.json"
dest = "$XDG_CONFIG_HOME/caelestia/cli.json"

[[components]]
name = "apps"
default = true
packages = ["brave-bin", "obs-studio", "libreoffice-fresh"]

# --- Optional components ---

[[components]]
name = "steam"
packages = ["steam"]

[[components]]
name = "virtualization"
packages = ["qemu-desktop", "virt-manager", "libvirt", "dnsmasq", "edk2-ovmf", "swtpm"]
post_install = ["chmod +x $HOME/.local/bin/caelestia-enable-virtualization", "$HOME/.local/bin/caelestia-enable-virtualization"]
post_update = ["chmod +x $HOME/.local/bin/caelestia-enable-virtualization", "$HOME/.local/bin/caelestia-enable-virtualization"]
[[components.entries]]
src = "scripts/caelestia-enable-virtualization.sh"
dest = "$HOME/.local/bin/caelestia-enable-virtualization"

[[components]]
name = "droidcam"
packages = ["droidcam", "v4l2loopback-dc-dkms"]

[[components]]
name = "spotify"
packages = ["spotify", "spicetify-cli", "spicetify-marketplace-bin", "acl"]
post_install = [
    "sudo setfacl -m u:$(id -un):rwx /opt/spotify",
    "sudo setfacl -R -m u:$(id -un):rwX /opt/spotify/Apps",
    "spicetify config current_theme caelestia color_scheme caelestia custom_apps marketplace",
    "spicetify backup apply",
]
post_update = [
    "sudo setfacl -m u:$(id -un):rwx /opt/spotify",
    "sudo setfacl -R -m u:$(id -un):rwX /opt/spotify/Apps",
    "spicetify apply",
]
[[components.entries]]
src = "spicetify"
dest = "$XDG_CONFIG_HOME/spicetify"

[[components]]
name = "discord"
packages = ["equibop-bin"]

[[components]]
name = "docker"
packages = ["docker", "docker-compose"]

[[components]]
name = "greetd"
packages = ["greetd"]
post_install = ["chmod +x $HOME/.local/bin/caelestia-install-greeter", "$HOME/.local/bin/caelestia-install-greeter"]
post_update = ["chmod +x $HOME/.local/bin/caelestia-install-greeter", "$HOME/.local/bin/caelestia-install-greeter"]
[[components.entries]]
src = "scripts/caelestia-install-greeter.sh"
dest = "$HOME/.local/bin/caelestia-install-greeter"
